name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.policy.outputs.version }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      latest: ${{ steps.policy.outputs.latest }}
      image: ${{ steps.policy.outputs.image }}
      commit_sha: ${{ steps.policy.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Version, notes and successful exact-commit main CI
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit_sha&per_page=100" > ci-runs.json
          python3 scripts/release_policy.py metadata --tag "$GITHUB_REF_NAME" --sha "$commit_sha" --repository "$GITHUB_REPOSITORY" --ci-json ci-runs.json --github-output "$GITHUB_OUTPUT"
          python3 scripts/release_policy.py unreleased --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.commit_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only unversioned digests are written here; promotion waits for both jobs.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.check.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=${{ needs.check.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Validate the exact published digest on its native architecture
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          image_id="$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Id}}')"
          python3 scripts/release_image.py --image "$image_id" --arch "$ARCH" --kind tvp --output "image-smoke-$ARCH.json"
          mkdir digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-${{ matrix.arch }}
          path: image-smoke-*.json
          retention-days: 7

  promote:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.commit_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: evidence-*
          path: release-evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only verified platform digests
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          files = sorted(Path('digests').glob('*.digest'))
          assert {p.stem for p in files} == {'amd64', 'arm64'} and len(files) == 2
          digests = [p.read_text().strip() for p in files]
          assert len(set(digests)) == 2 and all(re.fullmatch(r'sha256:[0-9a-f]{64}', d) for d in digests)
          Path('manifest-sources.txt').write_text(''.join(os.environ['IMAGE'] + '@' + d + '\n' for d in digests))
          PY
          mapfile -t sources < manifest-sources.txt
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > manifest.json
          python3 scripts/release_policy.py manifest --json manifest.json --require-provenance
      - name: Update latest only for a stable version
        if: ${{ needs.check.outputs.latest == 'true' }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
      - name: Publish GitHub release and validation evidence
        run: |
          case "$PRERELEASE" in
            true) gh release create "$GITHUB_REF_NAME" release-evidence/*.json --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$VERSION.md" --prerelease --latest=false ;;
            false) gh release create "$GITHUB_REF_NAME" release-evidence/*.json --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$VERSION.md" --latest ;;
            *) echo 'Invalid release classification' >&2; exit 1 ;;
          esac
