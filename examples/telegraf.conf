# Add this input to your existing Telegraf configuration/InfluxDB output.
# Replace the documentation address with the proxy's Docker host address,
# reachable from Telegraf. 38099 is the published port in docker-compose.yml.
[[inputs.prometheus]]
  urls = ["http://192.0.2.10:38099/metrics"]
  interval = "10s"
  metric_version = 2
  name_override = "tvp_proxy"
