[package]
name = "tvp-vod-proxy"
version = "0.0.2"
edition = "2024"
description = "Serve TVP live channels as stable MPEG-TS URLs for IPTV clients"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkowalski/tvp-vod-proxy-rs"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "net", "time", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"
